<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f18;
        }

        .login {
            width: 380px;
            background: #151b28;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #2d3748;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #0f1522;
            border: 1px solid #2b3447;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #2ea8ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2ea8ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
            font-weight: bold;
        }

        button:hover {
            background: #1d8de0;
        }

        #error {
            margin-top: 15px;
            color: #ff5d5d;
            text-align: center;
            font-size: 14px;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <div class="login">
        <h1>Admin Login</h1>

        <input type="email" id="email" placeholder="Email" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">

        <button id="loginBtn">Login</button>

        <p id="error"></p>
    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
